<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyLeave - 曆年制特休精算神器</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .container { background-color: white; width: 100%; max-width: 650px; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
        .author-tag { position: absolute; top: 10px; right: 20px; font-size: 11px; color: #bbb; font-style: italic; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; letter-spacing: 1px; }

        /* Mode Toggle */
        .mode-toggle { display: flex; border: 2px solid #2980b9; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .mode-btn { flex: 1; padding: 10px; background: white; border: none; cursor: pointer; font-size: 15px; font-weight: bold; color: #2980b9; transition: 0.2s; }
        .mode-btn.active { background-color: #2980b9; color: white; }
        .mode-btn:hover:not(.active) { background-color: #eaf4fb; }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }

        /* Hire date row */
        .hire-row { display: flex; align-items: flex-end; gap: 10px; }
        .hire-row input { flex: 1; }
        .btn-tenure { background-color: #8e44ad; color: white; border: none; border-radius: 6px; padding: 10px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; font-weight: bold; transition: 0.2s; }
        .btn-tenure:hover { background-color: #9b59b6; }

        /* Tenure popup */
        .tenure-popup { display: none; background: #f9f0ff; border: 1px solid #c39bd3; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .tenure-popup.show { display: block; }
        .tenure-popup label { color: #6c3483; }
        .tenure-row { display: flex; align-items: flex-end; gap: 10px; margin-top: 8px; }
        .tenure-row input { flex: 1; }
        .btn-calc-tenure { background-color: #6c3483; color: white; border: none; border-radius: 6px; padding: 10px 14px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .tenure-result { margin-top: 10px; font-size: 15px; color: #4a235a; font-weight: bold; background: #ede; padding: 8px 12px; border-radius: 6px; display: none; }

        /* Part-time */
        .parttime-popup { display: none; background: #fef9e7; border: 1px solid #f0d080; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .parttime-popup.show { display: block; }
        .parttime-popup label { color: #7d6608; }
        .parttime-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .parttime-row input { width: 140px; padding: 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 15px; }
        .parttime-hint { font-size: 12px; color: #888; margin-top: 5px; }
        .parttime-ratio-badge { display: none; background: #f39c12; color: white; border-radius: 5px; padding: 4px 10px; font-size: 13px; font-weight: bold; }

        input[type=date], input[type=number], input[type=text] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; box-sizing: border-box; }

        .btn-calc { width: 100%; padding: 15px; background-color: #2980b9; color: white; border: none; border-radius: 8px; font-size: 20px; cursor: pointer; transition: 0.3s; font-weight: bold; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-calc:hover { background-color: #3498db; transform: translateY(-2px); }
        .btn-save-small { background-color: #f39c12; color: white; border: none; border-radius: 5px; padding: 8px 15px; font-size: 14px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; margin-left: 10px; }
        .btn-save-small:hover { background-color: #e67e22; }

        #result-area { margin-top: 25px; display: none; border-top: 1px solid #eee; padding-top: 20px; }

        /* Anniversary mode: multiple result blocks */
        .anniv-block { background-color: #e8f6f3; border-left: 5px solid #1abc9c; padding: 15px; margin-bottom: 15px; }
        .anniv-block-title { font-size: 13px; color: #16a085; font-weight: bold; margin-bottom: 4px; }
        .anniv-block-value { font-size: 24px; font-weight: bold; color: #16a085; }

        .total-box-wrapper { background-color: #e8f6f3; border-left: 5px solid #1abc9c; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .total-content { display: flex; flex-direction: column; }
        .total-title { font-size: 14px; color: #666; margin-bottom: 5px; }
        .total-value { font-size: 32px; font-weight: bold; color: #16a085; }
        .total-days { font-size: 22px; color: #16a085; font-weight: bold; margin-left: 10px; }

        .detail-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .detail-table th, .detail-table td { border: 1px solid #eee; padding: 8px; text-align: left; }
        .detail-table th { background-color: #f8f9fa; color: #333; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 12px; color: white; background-color: #95a5a6; margin-left: 5px; }
        .badge-leap { background-color: #e74c3c; }
        .badge-parttime { background-color: #e67e22; }

        .footer-link { margin-top: 25px; padding-top: 15px; border-top: 1px solid #eee; text-align: center; }
        .footer-link a { color: #3498db; text-decoration: none; font-weight: bold; font-size: 14px; display: inline-flex; align-items: center; }

        #storage-area { margin-top: 30px; border-top: 2px dashed #ddd; padding-top: 20px; display: none; }
        .storage-title { font-size: 16px; color: #2c3e50; margin-bottom: 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .storage-actions { display: flex; gap: 10px; }
        .record-list { list-style: none; padding: 0; margin: 0; }
        .record-item { background: #f9f9f9; border: 1px solid #eee; padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .record-item:hover { background: #eef2f3; border-color: #ccc; }
        .record-info { display: flex; flex-direction: column; }
        .record-header { font-weight: bold; color: #333; font-size: 15px; margin-bottom: 4px; }
        .record-detail { font-size: 13px; color: #666; }
        .record-result { color: #16a085; font-weight: bold; margin-left: 5px; }
        .btn-delete-single { background-color: transparent; border: 1px solid #e74c3c; color: #e74c3c; border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 14px; }
        .btn-clear-all { background-color: #7f8c8d; color: white; font-size: 12px; padding: 5px 10px; width: auto; border: none; border-radius: 4px; cursor: pointer; }
        .btn-export { background-color: #27ae60; color: white; font-size: 12px; padding: 5px 10px; width: auto; border: none; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        .mode-label { display: inline-block; background: #2980b9; color: white; border-radius: 4px; padding: 2px 8px; font-size: 12px; margin-left: 8px; vertical-align: middle; }
        .mode-label.anniv { background: #27ae60; }
    </style>
</head>
<body>
<div class="container">
    <div class="author-tag">Created by Hunglung Lin</div>
    <h2>📅 EasyLeave 特休計算器</h2>

    <!-- Mode Toggle -->
    <div class="mode-toggle">
        <button class="mode-btn active" id="btn-calendar" onclick="setMode('calendar')">📅 曆年制</button>
        <button class="mode-btn" id="btn-anniversary" onclick="setMode('anniversary')">🎂 週年制</button>
    </div>

    <!-- Hire Date -->
    <div class="input-group">
        <label for="hireDate">員工到職日</label>
        <div class="hire-row">
            <input type="date" id="hireDate" value="2024-06-15">
            <button class="btn-tenure" onclick="toggleTenurePopup()">📊 年資</button>
            <button class="btn-tenure" style="background-color:#d68910;" onclick="toggleParttimePopup()">⏱️ 部份工時</button>
        </div>
    </div>

    <!-- Tenure Popup -->
    <div class="tenure-popup" id="tenure-popup">
        <label>📌 年資計算基準日（留空 = 今日）</label>
        <div class="tenure-row">
            <input type="date" id="tenureRefDate" placeholder="YYYY-MM-DD">
            <button class="btn-calc-tenure" onclick="calcTenure()">計算年資</button>
        </div>
        <div class="tenure-result" id="tenure-result"></div>
    </div>

    <!-- Part-time Popup -->
    <div class="parttime-popup" id="parttime-popup">
        <label>⏱️ 部份工時設定（正職全年工時預設 2088 小時）</label>
        <div class="parttime-row">
            <span style="color:#7d6608; font-size:14px;">員工全年總工時：</span>
            <input type="number" id="parttimeHours" placeholder="留空=正職(2088)" min="1" max="2088" oninput="updatePartTimeRatio()">
            <span id="parttime-ratio-badge" class="parttime-ratio-badge"></span>
        </div>
        <div class="parttime-hint">留空視為正職（比例 = 1.00）。輸入工時後自動計算比例並套用至結果。</div>
    </div>

    <!-- Query Year (calendar mode) -->
    <div class="input-group" id="calendar-year-group">
        <label for="queryYear">查詢年度 (YYYY)</label>
        <input type="number" id="queryYear" placeholder="例如：2026">
    </div>

    <!-- Query Year (anniversary mode) -->
    <div class="input-group" id="anniv-year-group" style="display:none;">
        <label for="queryYearAnniv">查詢年度 (YYYY) — 顯示該年度重疊區間及前後各一段</label>
        <input type="number" id="queryYearAnniv" placeholder="例如：2025">
    </div>

    <button onclick="calculateSafe()" class="btn-calc">開始計算</button>

    <!-- Result Area -->
    <div id="result-area">

        <!-- Calendar mode result -->
        <div id="calendar-result">
            <div class="total-box-wrapper">
                <div class="total-content">
                    <div class="total-title">
                        該年度新增特休總時數 (Annual Leave)
                        <span id="parttime-result-badge" class="badge badge-parttime" style="display:none;"></span>
                    </div>
                    <div>
                        <span class="total-value" id="totalHours">0.00 小時</span>
                        <span class="total-days" id="totalDays"></span>
                    </div>
                </div>
                <button onclick="saveResult()" class="btn-save-small">💾 儲存</button>
            </div>
            <h3>🔍 詳細計算說明</h3>
            <table class="detail-table">
                <thead><tr><th>區間</th><th>年資權益</th><th>有效重疊天數 / 分母</th><th>小計</th></tr></thead>
                <tbody id="detailBody"></tbody>
            </table>
        </div>

        <!-- Anniversary mode result -->
        <div id="anniv-result" style="display:none;">
            <div id="anniv-blocks"></div>
            <h3>🔍 詳細計算說明</h3>
            <table class="detail-table">
                <thead><tr><th>週年區間</th><th>年資</th><th>假別天數</th><th>時數</th></tr></thead>
                <tbody id="annivDetailBody"></tbody>
            </table>
            <div style="margin-top:10px; text-align:right;">
                <button onclick="saveResult()" class="btn-save-small">💾 儲存</button>
            </div>
        </div>

        <div class="footer-link">
            <a href="https://calcr2.mol.gov.tw/RestDays" target="_blank">🔗 【勞動部】特別休假日數試算系統</a>
        </div>
    </div>

    <!-- Storage -->
    <div id="storage-area">
        <div class="storage-title">
            <span>📋 計算紀錄 (<span id="record-count">0</span>/10)</span>
            <div class="storage-actions">
                <button onclick="exportCSV()" class="btn-export">📥 匯出 CSV</button>
                <button onclick="clearAllRecords()" class="btn-clear-all">🗑️ 清除全部</button>
            </div>
        </div>
        <ul id="record-list" class="record-list"></ul>
    </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────
let currentMode = 'calendar';
let savedRecords = [];
const MAX_RECORDS = 10;
const FULLTIME_HOURS = 2088;
const STORAGE_KEY = 'easyleave.records.v1';

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('queryYear').value = new Date().getFullYear();
    document.getElementById('queryYearAnniv').value = new Date().getFullYear();
    loadRecordsFromStorage();
});

// ── Mode ────────────────────────────────────────────────────────────────
function setMode(mode) {
    currentMode = mode;
    document.getElementById('btn-calendar').classList.toggle('active', mode === 'calendar');
    document.getElementById('btn-anniversary').classList.toggle('active', mode === 'anniversary');
    document.getElementById('calendar-year-group').style.display = mode === 'calendar' ? '' : 'none';
    document.getElementById('anniv-year-group').style.display = mode === 'anniversary' ? '' : 'none';
    document.getElementById('result-area').style.display = 'none';
}

// ── Part-time ────────────────────────────────────────────────────────────
function toggleParttimePopup() {
    const p = document.getElementById('parttime-popup');
    p.classList.toggle('show');
}
function getPartTimeRatio() {
    const v = parseFloat(document.getElementById('parttimeHours').value);
    if (!v || v <= 0) return 1;
    return Math.min(v, FULLTIME_HOURS) / FULLTIME_HOURS;
}
function updatePartTimeRatio() {
    const ratio = getPartTimeRatio();
    const badge = document.getElementById('parttime-ratio-badge');
    if (ratio < 1) {
        badge.style.display = 'inline-block';
        badge.innerText = `比例 × ${ratio.toFixed(4)}`;
    } else {
        badge.style.display = 'none';
    }
}

// ── Tenure ──────────────────────────────────────────────────────────────
function toggleTenurePopup() {
    const p = document.getElementById('tenure-popup');
    p.classList.toggle('show');
}
function calcTenure() {
    const hireDateVal = document.getElementById('hireDate').value;
    if (!hireDateVal) return alert('請先輸入到職日');
    const hire = parseDateInput(hireDateVal);
    const refVal = document.getElementById('tenureRefDate').value;
    const ref = refVal ? parseDateInput(refVal) : new Date();
    if (ref < hire) return alert('基準日不能早於到職日');
    const diffMs = ref - hire;
    const years = diffMs / (1000 * 60 * 60 * 24 * 365.25);
    const el = document.getElementById('tenure-result');
    el.style.display = 'block';
    const refStr = refVal || today();
    el.innerHTML = `📅 到職日：${hireDateVal}　基準日：${refStr}<br>📌 年資：<strong>${years.toFixed(2)} 年</strong>（約 ${Math.floor(diffMs / 86400000)} 天）`;
}
function today() {
    const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// ── Shared helpers ───────────────────────────────────────────────────────
function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0); }
function parseDateInput(value) {
    const [y, m, d] = value.split('-').map(Number);
    return new Date(y, m - 1, d);
}
function getDaysDiff(s, e) { return Math.round(Math.abs((e - s) / 86400000)) + 1; }
function formatDate(d) { return d.getFullYear()+'/'+(d.getMonth()+1).toString().padStart(2,'0')+'/'+d.getDate().toString().padStart(2,'0'); }
function getOverlapDays(s1, e1, s2, e2) { const s = s1 > s2 ? s1 : s2; const e = e1 < e2 ? e1 : e2; return s > e ? 0 : getDaysDiff(s, e); }
function addMonthsClamped(date, months) {
    const d = new Date(date);
    const originalDay = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + months);
    d.setDate(Math.min(originalDay, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
    return d;
}
function serviceAnniversaryDate(hireDate, years) {
    const y = hireDate.getFullYear() + years;
    const m = hireDate.getMonth();
    const day = Math.min(hireDate.getDate(), new Date(y, m + 1, 0).getDate());
    return new Date(y, m, day);
}
function hasLeapDay(s, e) { for (let y = s.getFullYear(); y <= e.getFullYear(); y++) { if (isLeap(y)) { const ld = new Date(y, 1, 29); if (ld >= s && ld <= e) return true; } } return false; }
function getEntitlement(y) {
    if (y < 1) return 0; if (y < 2) return 7; if (y < 3) return 10;
    if (y < 5) return 14; if (y < 10) return 15;
    let d = 16 + (y - 10); return d > 30 ? 30 : d;
}
// Years of service as a number (integer) at a given date
function yearsOfServiceAt(hireDate, atDate) {
    let y = atDate.getFullYear() - hireDate.getFullYear();
    const m = atDate.getMonth() - hireDate.getMonth();
    const d = atDate.getDate() - hireDate.getDate();
    if (m < 0 || (m === 0 && d < 0)) y--;
    return y;
}

// ── Calendar Mode ────────────────────────────────────────────────────────
function calculateCalendar(hireDateVal, queryYear, ratio) {
    const hireDate = parseDateInput(hireDateVal);
    const sixM = addMonthsClamped(hireDate, 6);
    const oneY = serviceAnniversaryDate(hireDate, 1);
    const probEnd = new Date(oneY); probEnd.setDate(probEnd.getDate() - 1);
    const probDenom = getDaysDiff(sixM, probEnd);
    const anniv = serviceAnniversaryDate(hireDate, queryYear - hireDate.getFullYear());
    const p1S = new Date(queryYear, 0, 1), p1E = new Date(anniv); p1E.setDate(p1E.getDate() - 1);
    const p2S = new Date(anniv), p2E = new Date(queryYear, 11, 31);

    let totalH = 0, html = "";
    const process = (start, end, isP2) => {
        if (end < start || end < hireDate) return;
        let num = 0, den = isLeap(queryYear) ? 366 : 365, h = 0, lbl = "";
        if (end >= sixM && end < oneY) {
            lbl = "滿半年 (3天)"; den = probDenom;
            if (hasLeapDay(sixM, probEnd)) lbl += " <span class='badge badge-leap'>含2/29</span>";
            num = getOverlapDays(start, end, sixM, probEnd); h = 3 * 8 * (num / den);
        } else if (end >= oneY) {
            let y = queryYear - hireDate.getFullYear() - (isP2 ? 0 : 1);
            let d = getEntitlement(y); lbl = `滿 ${y} 年 (${d}天)`;
            if (d === 30 && y > 24) lbl = `滿 ${y} 年 (上限 30天)`;
            const segStart = serviceAnniversaryDate(hireDate, y);
            const segEnd = serviceAnniversaryDate(hireDate, y + 1); segEnd.setDate(segEnd.getDate() - 1);
            den = getDaysDiff(segStart, segEnd);
            if (hasLeapDay(segStart, segEnd)) lbl += " <span class='badge badge-leap'>含2/29</span>";
            num = getOverlapDays(start, end, segStart, segEnd); h = d * 8 * (num / den);
        }
        if (num > 0) {
            const hAdj = h * ratio;
            totalH += hAdj;
            const adjNote = ratio < 1 ? ` <span class='badge badge-parttime'>×${ratio.toFixed(2)}</span>` : '';
            html += `<tr><td>${formatDateShort(start)}~${formatDateShort(end)}</td><td>${lbl}</td><td>${num}/${den}</td><td>${hAdj.toFixed(2)}H${adjNote}</td></tr>`;
        }
    };
    process(p1S, p1E, false); process(p2S, p2E, true);
    return { totalH, html };
}
function formatDateShort(d) { return (d.getMonth()+1)+'/'+d.getDate(); }

// ── Anniversary Mode ─────────────────────────────────────────────────────
// Builds ALL segments from hire date onwards (0~半年, 半年~1年, 1年~2年, …)
// then filters to the window around queryYear
function calculateAnniversary(hireDateVal, queryYear, ratio) {
    const hireDate = parseDateInput(hireDateVal);
    const today = new Date();

    // Key milestone dates
    const sixM = addMonthsClamped(hireDate, 6);
    const oneY = serviceAnniversaryDate(hireDate, 1);

    // Build all segments starting from hire
    const allSegs = [];

    // Segment 0: hire → day before 半年 (0 hours, just for reference — skip if same day)
    const preHalfEnd = new Date(sixM); preHalfEnd.setDate(preHalfEnd.getDate() - 1);
    if (preHalfEnd >= hireDate) {
        allSegs.push({ segStart: new Date(hireDate), segEnd: preHalfEnd, label: '未滿半年', days: 0, hours: 0 });
    }

    // Segment 1: 半年 → day before 1年 (3天)
    const halfYearEnd = new Date(oneY); halfYearEnd.setDate(halfYearEnd.getDate() - 1);
    allSegs.push({ segStart: new Date(sixM), segEnd: halfYearEnd, label: '滿半年 (3天)', days: 3, hours: 3 * 8 * ratio });

    // Segments 2+: each anniversary year
    for (let y = 1; y <= 80; y++) {
        const segStart = serviceAnniversaryDate(hireDate, y);
        const segEnd   = serviceAnniversaryDate(hireDate, y + 1);
        segEnd.setDate(segEnd.getDate() - 1);
        const days = getEntitlement(y);
        const hours = days * 8 * ratio;
        allSegs.push({ segStart, segEnd, label: `滿 ${y} 年 (${days}天)`, days, hours });
        if (segStart.getFullYear() > queryYear + 2) break; // no need to go further
    }

    // Mark the real current segment, but anchor the displayed window to the requested year.
    allSegs.forEach(s => {
        s.isCurrent = today >= s.segStart && today <= s.segEnd;
        s.overlapsQueryYear = getOverlapDays(s.segStart, s.segEnd, new Date(queryYear, 0, 1), new Date(queryYear, 11, 31)) > 0;
    });

    const firstOverlapIdx = allSegs.findIndex(s => s.overlapsQueryYear);
    if (firstOverlapIdx < 0) return [];
    const lastOverlapIdx = allSegs.findLastIndex ? allSegs.findLastIndex(s => s.overlapsQueryYear) : allSegs.length - 1 - [...allSegs].reverse().findIndex(s => s.overlapsQueryYear);
    const from = Math.max(0, firstOverlapIdx - 1);
    const to   = Math.min(allSegs.length - 1, lastOverlapIdx + 1);

    return allSegs.slice(from, to + 1);
}

// ── Main entry ────────────────────────────────────────────────────────────
function calculateSafe() { try { calculate(); } catch(e) { alert('錯誤：' + e.message); } }
function calculate() {
    const hireDateVal = document.getElementById('hireDate').value;
    if (!hireDateVal) return alert('請輸入到職日');
    const ratio = getPartTimeRatio();

    document.getElementById('result-area').style.display = 'none';
    document.getElementById('calendar-result').style.display = 'none';
    document.getElementById('anniv-result').style.display = 'none';

    if (currentMode === 'calendar') {
        const queryYear = parseInt(document.getElementById('queryYear').value);
        if (!queryYear) return alert('請輸入查詢年度');
        const { totalH, html } = calculateCalendar(hireDateVal, queryYear, ratio);
        document.getElementById('detailBody').innerHTML = html || "<tr><td colspan='4'>尚無權利</td></tr>";
        document.getElementById('totalHours').innerText = totalH.toFixed(2) + ' 小時';
        document.getElementById('totalDays').innerText = '【 ' + (totalH / 8).toFixed(1) + ' 日 】';
        const ptBadge = document.getElementById('parttime-result-badge');
        if (ratio < 1) { ptBadge.style.display = 'inline-block'; ptBadge.innerText = `部份工時 ×${ratio.toFixed(2)}`; }
        else { ptBadge.style.display = 'none'; }
        document.getElementById('calendar-result').style.display = 'block';
    } else {
        const queryYear = parseInt(document.getElementById('queryYearAnniv').value);
        if (!queryYear) return alert('請輸入查詢年度');
        const segs = calculateAnniversary(hireDateVal, queryYear, ratio);
        if (segs.length === 0) { alert('該年度尚無週年特休'); return; }
        // Card prioritizes the real current period only when it is in view; otherwise show the first paid period overlapping the queried year.
        const currentSeg = segs.find(s => s.isCurrent) || segs.find(s => s.overlapsQueryYear && s.hours > 0) || segs.find(s => s.overlapsQueryYear) || segs[0];
        const adjNote = ratio < 1 ? ` <span class='badge badge-parttime'>×${ratio.toFixed(2)}</span>` : '';
        // Card: only current period
        const cardHoursStr = currentSeg.hours > 0
            ? `${currentSeg.hours.toFixed(2)} 小時 &nbsp;【 ${(currentSeg.hours/8).toFixed(1)} 日 】${adjNote}`
            : `<span style="color:#999; font-size:18px;">0 小時（尚未達半年）</span>`;
        const blocksHtml = `<div class="anniv-block">
            <div class="anniv-block-title">📌 ${currentSeg.isCurrent ? '當前所在區間' : '查詢年度代表區間'}：${formatDate(currentSeg.segStart)} ～ ${formatDate(currentSeg.segEnd)}</div>
            <div class="anniv-block-value">${cardHoursStr}</div>
        </div>`;
        // Table: all segments
        let tableHtml = '';
        segs.forEach(s => {
            const cur = s.isCurrent ? ' style="background:#f0fff8; font-weight:bold;"' : '';
            const curMark = s.isCurrent ? ' ◀ 當前' : '';
            const hoursStr = s.hours > 0 ? `${s.hours.toFixed(2)} H` : `— (0 H)`;
            tableHtml += `<tr${cur}>
                <td>${formatDate(s.segStart)} ~ ${formatDate(s.segEnd)}${curMark}</td>
                <td>${s.label}</td>
                <td>${s.days > 0 ? s.days + ' 天' : '—'}</td>
                <td>${hoursStr}</td>
            </tr>`;
        });
        document.getElementById('anniv-blocks').innerHTML = blocksHtml;
        document.getElementById('annivDetailBody').innerHTML = tableHtml;
        document.getElementById('anniv-result').style.display = 'block';
    }

    document.getElementById('result-area').style.display = 'block';
    document.getElementById('result-area').scrollIntoView({ behavior: 'smooth' });
}

// ── Storage ────────────────────────────────────────────────────────────────
function saveResult() {
    let resultText = '';
    let p1 = '無', p2 = '無';
    if (currentMode === 'calendar') {
        resultText = document.getElementById('totalHours').innerText + ' ' + document.getElementById('totalDays').innerText;
        const rows = document.querySelectorAll('#detailBody tr');
        rows.forEach((r, i) => {
            const c = r.querySelectorAll('td');
            if (c.length >= 4) {
                let s = `${c[0].innerText} (${c[1].innerText.replace("含2/29","").trim()}) : ${c[2].innerText} ➜ ${c[3].innerText}`;
                if (i === 0) p1 = s;
                if (i === 1) p2 = s;
            }
        });
    } else {
        const block = document.querySelector('#anniv-blocks .anniv-block');
        if (block) {
            const title = block.querySelector('.anniv-block-title').innerText.replace(/^📌 (當前所在區間|查詢年度代表區間)：/, '').trim();
            const val = block.querySelector('.anniv-block-value').innerText.replace(/\s+/g,' ').trim();
            resultText = val;
            p1 = `${title} ➜ ${val}`;
        }
    }
    if (!resultText || resultText === '0.00 小時 【 0.0 日 】') return alert('請先計算出有效結果再儲存！');
    if (savedRecords.length >= MAX_RECORDS) return alert('紀錄已滿 (10筆)，請先清除部分紀錄。');
    let name = prompt('輸入編號/姓名 (空值帶時間)：');
    if (name === null) return;
    if (name.trim() === '') name = new Date().toTimeString().split(' ')[0];
    const yearVal = currentMode === 'calendar' ? document.getElementById('queryYear').value : document.getElementById('queryYearAnniv').value;
    savedRecords.unshift({ name, hireDate: document.getElementById('hireDate').value, year: yearVal, mode: currentMode, result: resultText, p1, p2 });
    renderRecords();
}
function persistRecords() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedRecords)); } catch (e) { console.warn('無法儲存計算紀錄', e); }
}
function loadRecordsFromStorage() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        savedRecords = raw ? JSON.parse(raw).slice(0, MAX_RECORDS) : [];
    } catch (e) {
        savedRecords = [];
        console.warn('無法讀取計算紀錄', e);
    }
    renderRecords(false);
}
function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function renderRecords(shouldPersist = true) {
    if (shouldPersist) persistRecords();
    const area = document.getElementById('storage-area');
    document.getElementById('record-count').innerText = savedRecords.length;
    area.style.display = savedRecords.length > 0 ? 'block' : 'none';
    let html = '';
    savedRecords.forEach((r, i) => {
        const shortResult = r.result.length > 35 ? r.result.substring(0, 35) + '…' : r.result;
        const modeLabel = r.mode === 'anniversary' ? '<span class="mode-label anniv">週年</span>' : '<span class="mode-label">曆年</span>';
        html += `<li class="record-item" onclick="loadRecord(${i})"><div class="record-info"><div class="record-header">${modeLabel} <span>#${savedRecords.length-i} ${escapeHTML(r.name)}</span><span class="record-result">${escapeHTML(shortResult)}</span></div><div class="record-detail">到職：${escapeHTML(r.hireDate)} | 年度：${escapeHTML(r.year)}</div></div><button class="btn-delete-single" onclick="deleteRecord(event,${i})">🗑️</button></li>`;
    });
    document.getElementById('record-list').innerHTML = html;
}
function loadRecord(i) {
    const r = savedRecords[i];
    document.getElementById('hireDate').value = r.hireDate;
    setMode(r.mode || 'calendar');
    if (r.mode === 'anniversary') document.getElementById('queryYearAnniv').value = r.year;
    else document.getElementById('queryYear').value = r.year;
    calculateSafe();
}
function deleteRecord(e, i) { e.stopPropagation(); if (confirm('刪除？')) { savedRecords.splice(i,1); renderRecords(); } }
function clearAllRecords() { if (confirm('全清？')) { savedRecords = []; renderRecords(); } }
function exportCSV() {
    if (savedRecords.length === 0) return alert('目前沒有紀錄可以匯出喔！');
    let csv = '\uFEFF序號,員工姓名,到職日,查詢年度,制度,總計算結果,前段計算(Period 1)/週年當下區間,後段計算(Period 2)\n';
    savedRecords.forEach((r, i) => {
        const safeName = `"${r.name.replace(/"/g, '""')}"`;
        const safeResult = `"${r.result}"`;
        const safeP1 = `"${(r.p1 || '無').replace(/"/g, '""')}"`;
        const safeP2 = `"${(r.p2 || '無').replace(/"/g, '""')}"`;
        const modeText = r.mode === 'anniversary' ? '週年制' : '曆年制';
        csv += `${savedRecords.length-i},${safeName},${r.hireDate},${r.year},${modeText},${safeResult},${safeP1},${safeP2}\n`;
    });
    const link = document.createElement('a');
    const now = new Date();
    link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    link.download = `EasyLeave_特休報表_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}.csv`;
    link.click();
}
</script>
